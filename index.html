<div class="app">
<header class="top">
 <div class="brand"><div class="logo" aria-label="PAS puzzle icon"><svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 5h11v5a4 4 0 1 0 8 0V5h11v11h-5a4 4 0 1 0 0 8h5v11H23v-5a4 4 0 1 0-8 0v5H5V23h5a4 4 0 1 0 0-8H5z" fill="currentColor"/><circle cx="20" cy="20" r="3" fill="#1d9bf0"/></svg></div><div><h1>PAD ARCHIVE STORAGE</h1><p>PAS · YOUR PUZZLE ARCHIVE</p></div></div>
 <div class="top-actions"><button class="ghost" id="themeToggle" aria-label="テーマ切り替え">☾ ダーク</button><button class="ghost" id="backupTop">↗ バックアップ</button><button class="ghost" id="settingsBtn">⚙</button></div>
</header>
<section class="hero"><div><div class="eyebrow">YOUR PERSONAL LIBRARY</div><h2>編成を、迷わず見つける。</h2><p>ダンジョン別に整理して、必要な編成へすぐアクセス。</p></div><div class="stats"><div class="stat"><b id="folderCount">0</b><span>フォルダ</span></div><div class="stat"><b id="linkCount">0</b><span>編成リンク</span></div><div class="stat"><b id="tagCount">0</b><span>タグ</span></div></div></section>
<div class="toolbar"><div class="search"><input id="searchInput" placeholder="編成名、URL、タグで検索"></div><button class="primary" id="addLink">＋ 編成リンク</button><button id="favoritesFilter" aria-pressed="false">☆ お気に入り</button><button id="addFolder">＋ フォルダ</button><button id="showBackup">保存・復元</button></div>
<div class="layout">
 <aside class="panel sidebar"><div class="side-head"><strong>フォルダ</strong><button id="sideAddFolder">＋</button></div><div class="tree" id="folderTree"></div><div class="side-foot"><strong style="font-size:11px">タグで絞り込み</strong><div class="tag-cloud" id="tagCloud"></div></div></aside>
 <main class="panel content-panel"><div class="content-head"><div><strong id="currentTitle">すべての編成</strong><div class="crumb" id="breadcrumb">ライブラリ全体</div></div><button class="ghost" id="sortBtn">更新順 ↓</button></div><div class="items" id="items"></div></main>
</div>
</div>
<nav class="mobile-tabs"><button class="active" data-tab="all"><span>⌂</span>すべて</button><button data-tab="folders"><span>▣</span>フォルダ</button><button data-tab="tags"><span>◇</span>タグ</button><button data-tab="backup"><span>↗</span>保存</button></nav>
<div class="modal-back" id="modalBack"><section class="modal" id="modal"></section></div><div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(()=>{'use strict';
const THEME_KEY='pas-theme-v1';
let theme=localStorage.getItem(THEME_KEY)||'light';
function applyTheme(){document.documentElement.dataset.theme=theme;document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#000000':'#ffffff';const b=document.getElementById('themeToggle');if(b)b.textContent=theme==='dark'?'☀ ライト':'☾ ダーク'}
applyTheme();
const KEY='pad-party-archive-v1';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const initial=()=>({version:1,folders:[{id:'root',name:'マイ編成',parentId:null,createdAt:Date.now()}],links:[]});
let data=load(),selected='all',activeTag='',favoritesOnly=false,sortNewest=true,qrChunks=[],qrIndex=0,scanParts={};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.folders)&&Array.isArray(d.links))return d}catch(e){}return initial()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));render()}catch(e){toast('保存できません。空き容量を確認してください')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function folder(id){return data.folders.find(f=>f.id===id)}
function pathOf(id){let a=[],f=folder(id),n=0;while(f&&n++<30){a.unshift(f.name);f=folder(f.parentId)}return a}
function allTags(){return [...new Set(data.links.flatMap(x=>x.tags||[]))].sort((a,b)=>a.localeCompare(b,'ja'))}
function descendants(id){const out=[id],walk=p=>data.folders.filter(f=>f.parentId===p).forEach(f=>{out.push(f.id);walk(f.id)});walk(id);return out}
function render(){document.getElementById('folderCount').textContent=data.folders.length-1;document.getElementById('linkCount').textContent=data.links.length;document.getElementById('tagCount').textContent=allTags().length;renderTree();renderTags();renderItems()}
function renderTree(){const el=document.getElementById('folderTree');const walk=(pid,depth)=>data.folders.filter(f=>f.parentId===pid).sort((a,b)=>a.name.localeCompare(b.name,'ja')).map(f=>{const count=data.links.filter(l=>l.folderId===f.id).length;return `<div class="tree-row ${selected===f.id?'active':''}" data-folder="${f.id}"><span class="indent" style="--depth:${depth}"></span><span>📁</span><span class="folder-name">${esc(f.name)}</span><span class="count">${count}</span><span class="tree-actions"><button data-newchild="${f.id}" title="子フォルダ">＋</button><button data-editfolder="${f.id}" title="編集">⋯</button></span></div>${walk(f.id,depth+1)}`}).join('');el.innerHTML=`<div class="tree-row ${selected==='all'?'active':''}" data-folder="all">⌂ <span class="folder-name">すべての編成</span><span class="count">${data.links.length}</span></div>`+walk(null,0)}
function renderTags(){const tags=allTags();document.getElementById('tagCloud').innerHTML=tags.length?tags.map(t=>`<span class="tag clickable" data-tag="${esc(t)}">${esc(t)}</span>`).join(''):'<span style="font-size:10px;color:var(--muted)">リンクにタグを追加すると表示されます</span>'}
function renderItems(){const q=document.getElementById('searchInput').value.trim().toLowerCase();let list=data.links.filter(l=>{const inFolder=favoritesOnly?!!l.favorite:(selected==='all'||descendants(selected).includes(l.folderId));const tagOk=!activeTag||(l.tags||[]).includes(activeTag);const folderText=pathOf(l.folderId).join(' ');const textOk=!q||[l.title,l.url,folderText,...(l.tags||[])].join(' ').toLowerCase().includes(q);return inFolder&&tagOk&&textOk});list.sort((a,b)=>sortNewest?b.updatedAt-a.updatedAt:a.title.localeCompare(b.title,'ja'));const f=folder(selected);document.getElementById('currentTitle').textContent=favoritesOnly?'お気に入り':activeTag?`タグ：${activeTag}`:selected==='all'?'すべての編成':f?.name||'フォルダ';document.getElementById('breadcrumb').textContent=favoritesOnly?'すべてのフォルダを横断して表示':activeTag?'タグで絞り込み':selected==='all'?'ライブラリ全体':pathOf(selected).join(' / ');const favBtn=document.getElementById('favoritesFilter');if(favBtn){favBtn.textContent=favoritesOnly?'★ お気に入り表示中':'☆ お気に入り';favBtn.setAttribute('aria-pressed',String(favoritesOnly))}const box=document.getElementById('items');box.innerHTML=list.length?list.map(l=>`<article class="item"><div class="link-icon">🔗</div><div class="item-main"><div class="item-heading"><a class="item-title-link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.title)}</a><button class="favorite-toggle ${l.favorite?'is-favorite':''}" data-favorite="${l.id}" aria-label="${l.favorite?'お気に入り解除':'お気に入りに追加'}" aria-pressed="${!!l.favorite}">${l.favorite?'★':'☆'}</button></div><div class="item-url">${esc(l.url)}</div><div class="item-tags">${(l.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<span class="tag" style="opacity:.65">${esc(pathOf(l.folderId).join(' / ')||'未分類')}</span></div></div><div class="item-actions"><button data-editlink="${l.id}">編集</button></div></article>`).join(''):`<div class="empty"><div class="symbol">${q||activeTag?'⌕':'▤'}</div><b>${q||activeTag?'一致する編成がありません':'ここに編成を追加できます'}</b><p>${q||activeTag?'検索条件やタグを変更してください。':'フォルダを作成し、攻略編成のURLを保存しましょう。'}<br>データはこの端末のブラウザ内に保存されます。</p></div>`;document.querySelectorAll('.tree-row').forEach(e=>e.addEventListener('click',ev=>{if(ev.target.closest('.tree-actions'))return;selected=e.dataset.folder;activeTag='';render()}));document.querySelectorAll('[data-tag]').forEach(e=>e.onclick=()=>{activeTag=e.dataset.tag;selected='all';renderItems()});document.querySelectorAll('[data-favorite]').forEach(e=>e.onclick=ev=>{ev.preventDefault();ev.stopPropagation();const l=data.links.find(x=>x.id===e.dataset.favorite);if(!l)return;l.favorite=!l.favorite;save();toast(l.favorite?'お気に入りに追加しました':'お気に入りから解除しました')});document.querySelectorAll('[data-editlink]').forEach(e=>e.onclick=()=>linkModal(e.dataset.editlink));document.querySelectorAll('[data-newchild]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();folderModal(null,e.dataset.newchild)});document.querySelectorAll('[data-editfolder]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();folderModal(e.dataset.editfolder)})}
function showModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBack').classList.add('show')}
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function folderOptions(current){return data.folders.map(f=>`<option value="${f.id}" ${f.id===current?'selected':''}>${esc(pathOf(f.id).join(' / '))}</option>`).join('')}
function folderModal(id=null,parent='root'){const f=id?folder(id):null;showModal(`<h3>${f?'フォルダを編集':'フォルダを作成'}</h3><div class="field"><label>フォルダ名</label><input id="folderName" maxlength="60" value="${esc(f?.name||'')}" placeholder="例：裏機構城"></div><div class="field"><label>保存先</label><select id="folderParent"><option value="">最上位</option>${folderOptions(f?.parentId??parent)}</select><small>フォルダの中にフォルダを作成して階層化できます。</small></div><div class="modal-actions">${f?'<button class="danger" id="deleteFolder">削除</button>':''}<button id="cancel">キャンセル</button><button class="primary" id="saveFolder">保存</button></div>`);document.getElementById('cancel').onclick=closeModal;document.getElementById('saveFolder').onclick=()=>{const name=document.getElementById('folderName').value.trim(),p=document.getElementById('folderParent').value||null;if(!name)return toast('フォルダ名を入力してください');if(f&&descendants(f.id).includes(p))return toast('自分自身の中には移動できません');if(f){f.name=name;f.parentId=p}else{const n={id:uid(),name,parentId:p,createdAt:Date.now()};data.folders.push(n);selected=n.id}closeModal();save();toast('フォルダを保存しました')};if(f)document.getElementById('deleteFolder').onclick=()=>{if(!confirm('このフォルダと子フォルダを削除します。中のリンクは「マイ編成」に移動します。'))return;const ids=descendants(f.id);data.links.forEach(l=>{if(ids.includes(l.folderId))l.folderId='root'});data.folders=data.folders.filter(x=>!ids.includes(x.id));selected='all';closeModal();save()}}
function linkModal(id=null){const l=id?data.links.find(x=>x.id===id):null;showModal(`<h3>${l?'編成リンクを編集':'編成リンクを追加'}</h3><div class="field"><label>編成名</label><input id="linkTitle" maxlength="100" value="${esc(l?.title||'')}" placeholder="例：裏千手・周回編成"></div><div class="field"><label>編成URL</label><input id="linkUrl" type="url" value="${esc(l?.url||'')}" placeholder="https://..."></div><div class="field"><label>保存フォルダ</label><select id="linkFolder">${folderOptions(l?.folderId|| (selected==='all'?'root':selected))}</select></div><div class="field"><label>タグ</label><input id="linkTags" value="${esc((l?.tags||[]).join(', '))}" placeholder="周回, 無効貫通, 超重力"><small>カンマ区切りで複数登録できます。</small></div><div class="modal-actions">${l?'<button class="danger" id="deleteLink">削除</button>':''}<button id="cancel">キャンセル</button><button class="primary" id="saveLink">保存</button></div>`);document.getElementById('cancel').onclick=closeModal;document.getElementById('saveLink').onclick=()=>{const title=document.getElementById('linkTitle').value.trim(),url=document.getElementById('linkUrl').value.trim();if(!title||!url)return toast('編成名とURLを入力してください');try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw 0}catch(e){return toast('正しいURLを入力してください')}const tags=[...new Set(document.getElementById('linkTags').value.split(/[,、]/).map(x=>x.trim()).filter(Boolean))];if(l)Object.assign(l,{title,url,tags,folderId:document.getElementById('linkFolder').value,updatedAt:Date.now()});else data.links.push({id:uid(),title,url,tags,folderId:document.getElementById('linkFolder').value,createdAt:Date.now(),updatedAt:Date.now()});closeModal();save();toast('編成リンクを保存しました')};if(l)document.getElementById('deleteLink').onclick=()=>{if(confirm('この編成リンクを削除しますか？')){data.links=data.links.filter(x=>x.id!==l.id);closeModal();save()}}}
function backupModal(){showModal(`<h3>保存・復元</h3><p class="notice">編成データはこの端末のブラウザ内に保存されます。機種変更やブラウザのデータ削除に備えて、定期的にバックアップしてください。</p><div style="display:grid;gap:9px;margin-top:16px"><button class="primary" id="exportJson">↓ JSONファイルを書き出す</button><button id="exportQr">▦ QRコードでバックアップ</button><label class="file-label">↑ JSONファイルから復元<input id="importJson" type="file" accept="application/json,.json"></label><button id="importQr">▣ QRコードをカメラで読み取る</button></div><p class="notice" style="margin-top:14px">QRバックアップはデータ量に応じて複数枚に分割します。読み取りはカメラ対応ブラウザ（HTTPS）で利用できます。</p><div class="modal-actions"><button id="closeBackup">閉じる</button></div>`);document.getElementById('closeBackup').onclick=closeModal;document.getElementById('exportJson').onclick=downloadJson;document.getElementById('exportQr').onclick=qrModal;document.getElementById('importJson').onchange=importJson;document.getElementById('importQr').onclick=scanModal}
function downloadJson(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pas-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('バックアップをダウンロードしました')}
function importJson(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.folders)||!Array.isArray(d.links))throw 0;if(confirm(`フォルダ${d.folders.length}件、リンク${d.links.length}件のデータで現在のデータを置き換えますか？`)){data={version:1,folders:d.folders,links:d.links};if(!folder('root'))data.folders.unshift({id:'root',name:'マイ編成',parentId:null});selected='all';activeTag='';save();closeModal();toast('復元しました')}}catch(x){toast('バックアップファイルを読み込めません')}};r.readAsText(file)}
function qrModal(){const raw=JSON.stringify(data),size=700,parts=[];for(let i=0;i<raw.length;i+=size)parts.push(raw.slice(i,i+size));const batch=uid();qrChunks=parts.map((v,i)=>JSON.stringify({app:'PAS',v:1,batch,i,total:parts.length,data:v}));qrIndex=0;showModal(`<h3>QRコードバックアップ</h3><p class="notice">QRコードをすべて保存してください（${parts.length}枚）。1枚ずつ画像保存できます。データ量が多い場合はJSONファイルでの保存をおすすめします。</p><div class="qr-area"><div id="qrCanvas"></div></div><div class="qr-nav"><button id="qrPrev">←</button><span id="qrPage"></span><button id="qrNext">→</button></div><div class="modal-actions"><button id="qrSave">このQRを画像保存</button><button id="qrClose">閉じる</button></div>`);drawQr();document.getElementById('qrPrev').onclick=()=>{qrIndex=Math.max(0,qrIndex-1);drawQr()};document.getElementById('qrNext').onclick=()=>{qrIndex=Math.min(qrChunks.length-1,qrIndex+1);drawQr()};document.getElementById('qrSave').onclick=saveQr;document.getElementById('qrClose').onclick=closeModal}
function drawQr(){const el=document.getElementById('qrCanvas');el.innerHTML='';if(!window.QRCode){el.textContent='QRライブラリを読み込めません';return}new QRCode(el,{text:qrChunks[qrIndex],width:230,height:230,correctLevel:QRCode.CorrectLevel.L});document.getElementById('qrPage').textContent=`${qrIndex+1} / ${qrChunks.length}`;document.getElementById('qrPrev').disabled=qrIndex===0;document.getElementById('qrNext').disabled=qrIndex===qrChunks.length-1}
function saveQr(){const c=document.querySelector('#qrCanvas canvas');if(!c)return;const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`pas-qr-${qrIndex+1}.png`;a.click()}
async function scanModal(){if(!('BarcodeDetector'in window)){toast('このブラウザはQR読み取りに対応していません。JSON復元を利用してください');return}showModal(`<h3>QRコードから復元</h3><p class="notice">バックアップQRを順番にカメラへ見せてください。すべて読み取ると復元できます。</p><video id="camera" autoplay playsinline style="width:100%;border-radius:12px;background:#000;margin-top:12px"></video><p id="scanStatus" style="font-size:12px;color:var(--muted)">カメラを起動しています...</p><div class="modal-actions"><button id="scanStop">閉じる</button></div>`);let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const video=document.getElementById('camera');video.srcObject=stream;const detector=new BarcodeDetector({formats:['qr_code']});let running=true;document.getElementById('scanStop').onclick=()=>{running=false;stream.getTracks().forEach(t=>t.stop());closeModal()};const loop=async()=>{if(!running)return;try{const codes=await detector.detect(video);for(const c of codes){const o=JSON.parse(c.rawValue);if(!['PAS','PADPARTY'].includes(o.app))continue;scanParts[o.batch]??={total:o.total,parts:{}};scanParts[o.batch].parts[o.i]=o.data;const got=Object.keys(scanParts[o.batch].parts).length;document.getElementById('scanStatus').textContent=`読み取り済み ${got} / ${o.total} 枚`;if(got===o.total){const raw=Array.from({length:o.total},(_,i)=>scanParts[o.batch].parts[i]).join(''),d=JSON.parse(raw);if(confirm(`フォルダ${d.folders.length}件、リンク${d.links.length}件を復元しますか？`)){data=d;selected='all';save();stream.getTracks().forEach(t=>t.stop());closeModal();toast('QRから復元しました')}running=false;return}}}catch(e){}requestAnimationFrame(loop)};loop()}catch(e){document.getElementById('scanStatus').textContent='カメラを起動できません。HTTPS接続とカメラ権限を確認してください。'}}
document.getElementById('favoritesFilter').onclick=()=>{favoritesOnly=!favoritesOnly;selected='all';activeTag='';renderItems()};document.getElementById('addFolder').onclick=()=>folderModal(null,selected==='all'?'root':selected);document.getElementById('sideAddFolder').onclick=()=>folderModal(null,selected==='all'?'root':selected);document.getElementById('addLink').onclick=()=>linkModal();document.getElementById('showBackup').onclick=backupModal;document.getElementById('backupTop').onclick=backupModal;document.getElementById('settingsBtn').onclick=()=>{showModal(`<h3>PAS 設定</h3><p class="notice">PAD ARCHIVE STORAGE v1.1<br>編成データとテーマ設定は、このブラウザ内に保存されます。テーマの初期設定はライトモードです。<br>サーバーへの編成データ送信は行いません。ブラウザのデータ消去や端末故障に備えてバックアップしてください。</p><div class="field"><label>表示テーマ</label><button id="modalTheme" class="primary">${theme==='dark'?'ライトモードにする':'ダークモードにする'}</button></div><div class="modal-actions"><button id="closeInfo">閉じる</button></div>`);document.getElementById('modalTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem(THEME_KEY,theme);applyTheme();document.getElementById('modalTheme').textContent=theme==='dark'?'ライトモードにする':'ダークモードにする'};document.getElementById('closeInfo').onclick=closeModal};document.getElementById('themeToggle').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem(THEME_KEY,theme);applyTheme()};document.getElementById('searchInput').oninput=renderItems;document.getElementById('sortBtn').onclick=()=>{sortNewest=!sortNewest;document.getElementById('sortBtn').textContent=sortNewest?'更新順 ↓':'名前順 ↑';renderItems()};document.getElementById('modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()};document.querySelectorAll('.mobile-tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mobile-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.tab==='all'){selected='all';activeTag='';render()}if(b.dataset.tab==='folders')folderModal(null,'root');if(b.dataset.tab==='tags'){showModal(`<h3>タグ一覧</h3><div class="tag-cloud">${allTags().map(t=>`<span class="tag clickable" data-picktag="${esc(t)}">${esc(t)}</span>`).join('')||'タグはまだありません'}</div><div class="modal-actions"><button id="tagClose">閉じる</button></div>`);document.getElementById('tagClose').onclick=closeModal;document.querySelectorAll('[data-picktag]').forEach(x=>x.onclick=()=>{activeTag=x.dataset.picktag;selected='all';closeModal();renderItems()})}if(b.dataset.tab==='backup')backupModal()});render();
})();
</script>
</body></html>
