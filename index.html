function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.folders)&&Array.isArray(d.links))return d}catch(e){}return initial()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));render()}catch(e){toast('保存できません。空き容量を確認してください')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function folder(id){return data.folders.find(f=>f.id===id)}
function pathOf(id){let a=[],f=folder(id),n=0;while(f&&n++<30){a.unshift(f.name);f=folder(f.parentId)}return a}
function descendants(id){const out=[id],walk=p=>data.folders.filter(f=>f.parentId===p).forEach(f=>{out.push(f.id);walk(f.id)});walk(id);return out}
function render(){renderTree();renderItems()}
function renderTree(){
 const el=document.getElementById('folderTree');
 const make=(pid,depth)=>data.folders.filter(f=>f.parentId===pid).sort((a,b)=>a.name.localeCompare(b.name,'ja')).map(f=>{
  const kids=data.folders.some(x=>x.parentId===f.id),open=expandedFolders.has(f.id),count=data.links.filter(l=>l.folderId===f.id).length;
  return `<div class="tree-node"><div class="tree-row ${selected===f.id?'active':''}" data-folder="${f.id}" data-drop-folder="${f.id}" draggable="true" style="--depth:${depth}">
   <button class="tree-expander ${kids?'':'is-leaf'}" data-expand="${f.id}" aria-label="フォルダを${open?'閉じる':'開く'}">${kids?(open?'▾':'▸'):'·'}</button><span class="tree-folder-icon">${open?'📂':'📁'}</span><span class="folder-name">${esc(f.name)}</span><span class="count">${count}</span><span class="tree-actions"><button data-newchild="${f.id}" title="子フォルダを作成">＋</button><button data-editfolder="${f.id}" title="名前変更・管理">⋯</button></span>
  </div>${kids&&open?make(f.id,depth+1):''}</div>`;
 }).join('');
 el.innerHTML=`<div class="tree-row ${selected==='all'?'active':''}" data-folder="all"><span class="tree-expander is-leaf">·</span><span class="tree-folder-icon">⌂</span><span class="folder-name">すべての編成</span><span class="count">${data.links.length}</span></div>`+make(null,0);
 el.querySelectorAll('[data-expand]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.expand;expandedFolders.has(id)?expandedFolders.delete(id):expandedFolders.add(id);renderTree()});
 el.querySelectorAll('.tree-row[data-folder]').forEach(row=>row.addEventListener('click',e=>{if(e.target.closest('.tree-actions')||e.target.closest('[data-expand]'))return;selected=row.dataset.folder;favoritesOnly=false;render()}));
 el.querySelectorAll('[data-newchild]').forEach(b=>b.onclick=e=>{e.stopPropagation();folderModal(null,b.dataset.newchild)});
 el.querySelectorAll('[data-editfolder]').forEach(b=>b.onclick=e=>{e.stopPropagation();folderModal(b.dataset.editfolder)});
 el.querySelectorAll('[data-drop-folder]').forEach(row=>{
  row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('tree-drop-target')});
  row.addEventListener('dragleave',()=>row.classList.remove('tree-drop-target'));
  row.addEventListener('drop',e=>{e.preventDefault();row.classList.remove('tree-drop-target');const payload=JSON.parse(e.dataTransfer.getData('text/plain')||'{}');moveIntoFolder(payload,row.dataset.dropFolder)});
  row.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',JSON.stringify({type:'folder',id:row.dataset.dropFolder}));e.dataTransfer.effectAllowed='move'});
 });
}
function renderItems(){
 const q=document.getElementById('searchInput').value.trim().toLowerCase();
 const current=folder(selected),isVirtual=selected==='all'||favoritesOnly;
 const childFolders=isVirtual?data.folders.filter(f=>f.parentId===null):data.folders.filter(f=>f.parentId===selected);
 let list=data.links.filter(l=>{
  const inFolder=favoritesOnly?!!l.favorite:selected==='all'?true:l.folderId===selected;
  const folderText=pathOf(l.folderId).join(' ');
  const textOk=!q||[l.title,l.url,folderText,...(l.tags||[])].join(' ').toLowerCase().includes(q);
  return inFolder&&textOk;
 });
 if(!favoritesOnly&&!q&&selected==='all')list=list.filter(l=>!l.folderId);
 list.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
 document.getElementById('currentTitle').textContent=favoritesOnly?'お気に入り':selected==='all'?'すべての編成':current?.name||'フォルダ';
 document.getElementById('breadcrumb').textContent=favoritesOnly?'すべてのフォルダを横断して表示':selected==='all'?'ライブラリ全体':pathOf(selected).join(' / ');
 const favBtn=document.getElementById('favoritesFilter');if(favBtn){favBtn.textContent=favoritesOnly?'★ お気に入り表示中':'☆ お気に入り';favBtn.setAttribute('aria-pressed',String(favoritesOnly))}
 const box=document.getElementById('items');
 const folderCards=(favoritesOnly||q)?[]:childFolders.map(f=>`<article class="folder-card" data-open-folder="${f.id}" draggable="true"><span class="folder-card-icon">📁</span><span class="folder-card-name">${esc(f.name)}</span><span class="folder-card-count">${data.links.filter(l=>l.folderId===f.id).length}件</span><span class="folder-card-actions"><button data-newchild="${f.id}" title="子フォルダを作成">＋</button><button data-editfolder="${f.id}" title="フォルダを編集">⋯</button></span></article>`).join('');
 const linkCards=list.map(l=>`<article class="item" draggable="true" data-drag-link="${l.id}"><div class="link-icon">🔗</div><div class="item-main"><div class="item-heading"><button class="item-title-link" data-preview="${l.id}">${esc(l.title)}</button><button class="favorite-toggle ${l.favorite?'is-favorite':''}" data-favorite="${l.id}" aria-label="${l.favorite?'お気に入り解除':'お気に入りに追加'}" aria-pressed="${!!l.favorite}">${l.favorite?'★':'☆'}</button></div><div class="item-url">${esc(l.url)}</div><div class="item-tags">${(l.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><img class="item-preview" data-preview-image="${l.id}" src="${l.imageData||""}" alt="編成画像プレビュー" style="${l.imageData?"":"display:none"}"></div><div class="item-actions"><button data-editlink="${l.id}">編集</button></div></article>`).join('');
 box.innerHTML=(folderCards?'<div class="folder-grid">'+folderCards+'</div>':'')+(linkCards||(!folderCards?'<div class="empty"><div class="symbol">'+(q?'⌕':'▤')+'</div><b>'+(q?'一致する編成がありません':'このフォルダは空です')+'</b><p>'+(q?'検索条件を変更してください。':'「＋ フォルダ」で子フォルダを作成するか、「＋ 編成リンク」で編成を追加できます。')+'<br>データはこの端末のブラウザ内に保存されます。</p></div>':''));
 box.querySelectorAll('[data-open-folder]').forEach(e=>e.onclick=ev=>{if(ev.target.closest('.folder-card-actions'))return;selected=e.dataset.openFolder;expandedFolders.add(selected);render()});
 box.querySelectorAll('[data-newchild]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();folderModal(null,e.dataset.newchild)});
 box.querySelectorAll('[data-editfolder]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();folderModal(e.dataset.editfolder)});
 box.querySelectorAll('[data-drag-link]').forEach(e=>e.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',JSON.stringify({type:'link',id:e.dataset.dragLink}));ev.dataTransfer.effectAllowed='move'}));
 box.querySelectorAll('.folder-card[draggable=true]').forEach(e=>e.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',JSON.stringify({type:'folder',id:e.dataset.openFolder}));ev.dataTransfer.effectAllowed='move'}));
 box.querySelectorAll('[data-preview]').forEach(e=>e.onclick=()=>openLinkPreview(e.dataset.preview));
 box.querySelectorAll('[data-favorite]').forEach(e=>e.onclick=ev=>{ev.preventDefault();ev.stopPropagation();const l=data.links.find(x=>x.id===e.dataset.favorite);if(!l)return;l.favorite=!l.favorite;save();toast(l.favorite?'お気に入りに追加しました':'お気に入りから解除しました')});
 box.querySelectorAll('[data-editlink]').forEach(e=>e.onclick=()=>linkModal(e.dataset.editlink));
 box.querySelectorAll('[data-preview-image]').forEach(e=>e.onclick=()=>openLinkPreview(e.dataset.previewImage));
}
function moveIntoFolder(payload,targetId){
 if(!payload?.id||!targetId)return;
 if(payload.type==='link'){const l=data.links.find(x=>x.id===payload.id);if(!l)return;l.folderId=targetId;l.updatedAt=Date.now();save();toast('編成を移動しました');return}
 if(payload.type==='folder'){const f=folder(payload.id);if(!f||f.id===targetId||descendants(f.id).includes(targetId))return toast('この場所には移動できません');f.parentId=targetId;expandedFolders.add(targetId);save();toast('フォルダを移動しました')}
}
function isXUrl(url){try{const u=new URL(url);return /(^|\.)((x|twitter)\.com)$/.test(u.hostname)&&/\/status\/\d+/.test(u.pathname)}catch(e){return false}}
function openLinkPreview(id){const l=data.links.find(x=>x.id===id);if(!l)return;const isX=isXUrl(l.url);const image=l.imageData?'<img class="image-preview-large" src="'+l.imageData+'" alt="編成画像">':'';const tags=(l.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');const body=isX?'<section class="x-post-preview"><div class="x-preview-label">𝕏 POST</div><div id="xPostContent" class="x-post-content">ポスト内容を読み込んでいます...</div></section>':'<p class="preview-description">リンク先を開く前に内容を確認できます。</p>';showModal('<div class="preview-screen"><header class="preview-header"><button id="previewBack" class="ghost">← 一覧に戻る</button><strong>編成プレビュー</strong></header><div class="preview-content"><h2>'+esc(l.title)+'</h2><div class="preview-tags">'+tags+'</div>'+image+body+'</div><footer class="preview-actions"><button id="previewReturn">一覧に戻る</button><button class="primary" id="previewOpen">'+(isX?'Xでポストを開く':'リンク先を開く')+' ↗</button></footer></div>');document.getElementById('modal').classList.add('preview-modal');document.getElementById('modalBack').classList.add('preview-back');document.getElementById('previewBack').onclick=closeModal;document.getElementById('previewReturn').onclick=closeModal;document.getElementById('previewOpen').onclick=()=>window.open(l.url,'_blank','noopener,noreferrer');if(isX)loadXPost(l.url)}
async function loadXPost(url){const target=document.getElementById('xPostContent');if(!target)return;try{const endpoint='https://publish.twitter.com/oembed?url='+encodeURIComponent(url)+'&omit_script=true&dnt=true';const response=await fetch(endpoint);if(!response.ok)throw new Error('oEmbed unavailable');const result=await response.json();const current=document.getElementById('xPostContent');if(!current)return;current.innerHTML=result.html||'ポストを表示できませんでした。';if(!document.querySelector('script[data-x-widgets]')){const script=document.createElement('script');script.src='https://platform.twitter.com/widgets.js';script.async=true;script.dataset.xWidgets='true';document.body.appendChild(script)}else if(window.twttr?.widgets?.load){window.twttr.widgets.load(current)}}catch(e){const current=document.getElementById('xPostContent');if(current)current.innerHTML='<p>ポストのプレビューを取得できませんでした。</p><p class="x-preview-fallback">「Xでポストを開く」から内容を確認できます。</p>'}}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.78))};img.src=reader.result};reader.readAsDataURL(file)})}
function showModal(html){const m=document.getElementById('modal'),back=document.getElementById('modalBack');m.className='modal';back.classList.remove('preview-back');m.innerHTML=html;back.classList.add('show')}
function closeModal(){scanRunning=false;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}const back=document.getElementById('modalBack');back.classList.remove('show','preview-back');document.getElementById('modal').className='modal'}
function folderOptions(current){return data.folders.map(f=>`<option value="${f.id}" ${f.id===current?'selected':''}>${esc(pathOf(f.id).join(' / '))}</option>`).join('')}
function folderModal(id=null,parent='root'){const f=id?folder(id):null;showModal(`<h3>${f?'フォルダを編集':'フォルダを作成'}</h3><div class="field"><label>フォルダ名</label><input id="folderName" maxlength="60" value="${esc(f?.name||'')}" placeholder="例：裏機構城"></div><div class="field"><label>保存先</label><select id="folderParent"><option value="">最上位</option>${folderOptions(f?.parentId??parent)}</select><small>フォルダの中にフォルダを作成して階層化できます。</small></div><div class="modal-actions">${f?'<button class="danger" id="deleteFolder">削除</button>':''}<button id="cancel">キャンセル</button><button class="primary" id="saveFolder">保存</button></div>`);document.getElementById('cancel').onclick=closeModal;document.getElementById('saveFolder').onclick=()=>{const name=document.getElementById('folderName').value.trim(),p=document.getElementById('folderParent').value||null;if(!name)return toast('フォルダ名を入力してください');if(f&&descendants(f.id).includes(p))return toast('自分自身の中には移動できません');if(f){f.name=name;f.parentId=p}else{const n={id:uid(),name,parentId:p,createdAt:Date.now()};data.folders.push(n);selected=n.id}if(p)expandedFolders.add(p);closeModal();save();toast('フォルダを保存しました')};if(f)document.getElementById('deleteFolder').onclick=()=>{if(!confirm('このフォルダと子フォルダを削除します。中のリンクは「マイ編成」に移動します。'))return;const ids=descendants(f.id);data.links.forEach(l=>{if(ids.includes(l.folderId))l.folderId='root'});data.folders=data.folders.filter(x=>!ids.includes(x.id));selected='all';closeModal();save()}}
function linkModal(id=null){const l=id?data.links.find(x=>x.id===id):null;let attachedImage=l?.imageData||"";showModal(`<h3>${l?'編成リンクを編集':'編成リンクを追加'}</h3><div class="field"><label>編成名</label><input id="linkTitle" maxlength="100" value="${esc(l?.title||'')}" placeholder="例：裏千手・周回編成"></div><div class="field"><label>編成URL</label><input id="linkUrl" type="url" value="${esc(l?.url||'')}" placeholder="https://..."></div><div class="field"><label>保存フォルダ</label><select id="linkFolder">${folderOptions(l?.folderId|| (selected==='all'?'root':selected))}</select></div><div class="field"><label>タグ</label><input id="linkTags" value="${esc((l?.tags||[]).join(', '))}" placeholder="周回, 無効貫通, 超重力"><small>カンマ区切りで複数登録できます。</small></div><div class="field"><label>編成画像（任意）</label><input id="linkImage" type="file" accept="image/*"><small>画像は縮小して端末内に保存します。</small><div id="imageStatus" style="font-size:11px;color:var(--muted);margin-top:7px">${attachedImage?"画像を添付済みです":""}</div><button type="button" id="removeImage" class="ghost" ${attachedImage?"":"disabled"}>画像を削除</button></div><div class="modal-actions">${l?'<button class="danger" id="deleteLink">削除</button>':''}<button id="cancel">キャンセル</button><button class="primary" id="saveLink">保存</button></div>`);document.getElementById('cancel').onclick=closeModal;document.getElementById('linkImage').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{attachedImage=await compressImage(file);document.getElementById('imageStatus').textContent='画像を添付しました';document.getElementById('removeImage').disabled=false}catch(err){toast('画像を読み込めませんでした')}};document.getElementById('removeImage').onclick=()=>{attachedImage='';document.getElementById('linkImage').value='';document.getElementById('imageStatus').textContent='画像は添付されていません';document.getElementById('removeImage').disabled=true};document.getElementById('saveLink').onclick=()=>{const title=document.getElementById('linkTitle').value.trim(),url=document.getElementById('linkUrl').value.trim();if(!title||!url)return toast('編成名とURLを入力してください');try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw 0}catch(e){return toast('正しいURLを入力してください')}const tags=[...new Set(document.getElementById('linkTags').value.split(/[,、]/).map(x=>x.trim()).filter(Boolean))];if(l)Object.assign(l,{title,url,tags,folderId:document.getElementById('linkFolder').value,imageData:attachedImage||'',updatedAt:Date.now()});else data.links.push({id:uid(),title,url,tags,folderId:document.getElementById('linkFolder').value,imageData:attachedImage||'',createdAt:Date.now(),updatedAt:Date.now()});closeModal();save();toast('編成リンクを保存しました')};if(l)document.getElementById('deleteLink').onclick=()=>{if(confirm('この編成リンクを削除しますか？')){data.links=data.links.filter(x=>x.id!==l.id);closeModal();save()}}}
function backupModal(){showModal(`<h3>保存・復元</h3><p class="notice">編成データはこの端末のブラウザ内に保存されます。機種変更やブラウザのデータ削除に備えて、定期的にバックアップしてください。</p><div style="display:grid;gap:9px;margin-top:16px"><button class="primary" id="exportJson">↓ JSONファイルを書き出す</button><button id="exportQr">▦ QRコードでバックアップ</button><label class="file-label">↑ JSONファイルから復元<input id="importJson" type="file" accept="application/json,.json"></label><button id="importQr">▣ QRコードをカメラで読み取る</button></div><p class="notice" style="margin-top:14px">QRバックアップはデータ量に応じて複数枚に分割します。読み取りはカメラ対応ブラウザ（HTTPS）で利用できます。</p><div class="modal-actions"><button id="closeBackup">閉じる</button></div>`);document.getElementById('closeBackup').onclick=closeModal;document.getElementById('exportJson').onclick=downloadJson;document.getElementById('exportQr').onclick=qrModal;document.getElementById('importJson').onchange=importJson;document.getElementById('importQr').onclick=scanModal}
function downloadJson(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pas-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('バックアップをダウンロードしました')}
function importJson(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.folders)||!Array.isArray(d.links))throw 0;if(confirm(`フォルダ${d.folders.length}件、リンク${d.links.length}件のデータで現在のデータを置き換えますか？`)){data={version:1,folders:d.folders,links:d.links};if(!folder('root'))data.folders.unshift({id:'root',name:'マイ編成',parentId:null});selected='all';save();closeModal();toast('復元しました')}}catch(x){toast('バックアップファイルを読み込めません')}};r.readAsText(file)}
function splitQrData(raw,maxBytes=420){const chunks=[];let part='',bytes=0;for(const char of raw){const n=new TextEncoder().encode(char).length;if(bytes+n>maxBytes&&part){chunks.push(part);part='';bytes=0}part+=char;bytes+=n}if(part)chunks.push(part);return chunks}
function qrModal(){const raw=JSON.stringify(data),parts=splitQrData(raw),batch=uid();qrChunks=parts.map((v,i)=>JSON.stringify({app:'PAS',v:1,batch,i,total:parts.length,data:v}));qrIndex=0;showModal(`<h3>QRコードバックアップ</h3><p class="notice">QRコードをすべて保存してください（${parts.length}枚）。1枚ずつ画像保存できます。読み取りやすいように分割しています。</p><div class="qr-area"><div id="qrCanvas"></div></div><div class="qr-nav"><button id="qrPrev">←</button><span id="qrPage"></span><button id="qrNext">→</button></div><div class="modal-actions"><button id="qrSave">このQRを画像保存</button><button id="qrClose" type="button">閉じる</button></div>`);drawQr();document.getElementById('qrPrev').onclick=()=>{qrIndex=Math.max(0,qrIndex-1);drawQr()};document.getElementById('qrNext').onclick=()=>{qrIndex=Math.min(qrChunks.length-1,qrIndex+1);drawQr()};document.getElementById('qrSave').onclick=saveQr;document.getElementById('qrClose').onclick=closeModal}
function drawQr(){const el=document.getElementById('qrCanvas');el.innerHTML='';if(!window.QRCode){el.textContent='QRライブラリを読み込めません';return}new QRCode(el,{text:qrChunks[qrIndex],width:230,height:230,correctLevel:QRCode.CorrectLevel.L});document.getElementById('qrPage').textContent=`${qrIndex+1} / ${qrChunks.length}`;document.getElementById('qrPrev').disabled=qrIndex===0;document.getElementById('qrNext').disabled=qrIndex===qrChunks.length-1}
function saveQr(){const holder=document.getElementById('qrCanvas'),c=holder?.querySelector('canvas'),img=holder?.querySelector('img');const url=c?c.toDataURL('image/png'):img?.src;if(!url)return toast('QR画像を作成できませんでした');const a=document.createElement('a');a.href=url;a.download=`pas-qr-${qrIndex+1}.png`;document.body.appendChild(a);a.click();a.remove()}
async function scanModal(){if(!('BarcodeDetector'in window)&&typeof window.jsQR!=='function'){toast('QR読み取り機能を読み込めません。JSON復元を利用してください');return}showModal(`<h3>QRコードから復元</h3><p class="notice">バックアップQRを順番にカメラへ見せてください。すべて読み取ると復元できます。</p><video id="camera" autoplay playsinline muted style="width:100%;border-radius:12px;background:#000;margin-top:12px"></video><canvas id="scanCanvas" class="hidden"></canvas><p id="scanStatus" style="font-size:12px;color:var(--muted)">カメラを起動しています...</p><div class="modal-actions"><button id="scanStop" type="button">閉じる</button></div>`);document.getElementById('scanStop').onclick=closeModal;try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(!document.getElementById('camera')){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;return}const video=document.getElementById('camera'),canvas=document.getElementById('scanCanvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});video.srcObject=scanStream;await video.play();const detector=('BarcodeDetector'in window)?new BarcodeDetector({formats:['qr_code']}):null;scanRunning=true;let lastValue='';const loop=async()=>{if(!scanRunning||!document.getElementById('camera'))return;if(video.readyState>=2){let value='';try{if(detector){const codes=await detector.detect(video);if(codes.length)value=codes[0].rawValue}else{canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0,canvas.width,canvas.height);const result=window.jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});if(result)value=result.data}}catch(e){}if(value&&value!==lastValue){lastValue=value;try{const o=JSON.parse(value);if(o.app==='PAS'&&Number.isInteger(o.i)&&Number.isInteger(o.total)&&o.total>0&&o.total<=10000&&typeof o.data==='string'){scanParts[o.batch]??={total:o.total,parts:{}};scanParts[o.batch].parts[o.i]=o.data;const got=Object.keys(scanParts[o.batch].parts).length;const status=document.getElementById('scanStatus');if(status)status.textContent=`読み取り済み ${got} / ${o.total} 枚`;if(got===o.total){const raw=Array.from({length:o.total},(_,i)=>scanParts[o.batch].parts[i]).join(''),d=JSON.parse(raw);if(!Array.isArray(d.folders)||!Array.isArray(d.links))throw new Error('invalid backup');if(confirm(`フォルダ${d.folders.length}件、リンク${d.links.length}件を復元しますか？`)){data=d;if(!folder('root'))data.folders.unshift({id:'root',name:'マイ編成',parentId:null});selected='all';save();closeModal();toast('QRから復元しました')}return}}}catch(e){}}else if(!value){lastValue=''}}if(scanRunning)requestAnimationFrame(loop)};requestAnimationFrame(loop)}catch(e){const status=document.getElementById('scanStatus');if(status)status.textContent='カメラを起動できません。HTTPS接続とカメラ権限を確認してください。'}}
